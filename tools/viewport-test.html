<!doctype html>
<!-- Viewport harness for headless checks: embeds index.html in an iframe of an exact CSS size
     (Windows Chrome refuses windows narrower than 500 px, so ?w=390&h=844 cannot be tested directly).
     Usage: tools/viewport-test.html?w=390&h=844&headless=1&t=12&pause=1   (all other params pass through) -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#222;height:100%}iframe{border:0;display:block;background:#000}</style>
<script>
  const q = new URLSearchParams(location.search);
  const w = q.get('w') || 390, h = q.get('h') || 844; q.delete('w'); q.delete('h');
  document.write(`<iframe id="f" width="${w}" height="${h}" src="../index.html?${q.toString()}"></iframe>`);
</script>
